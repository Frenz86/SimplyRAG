services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: owui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owui -d openwebui"]
      interval: 10s
      retries: 5

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    command: caddy reverse-proxy --from :80 --to open-webui:8080
    depends_on:
      open-webui:
        condition: service_healthy
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9.5-slim  # verifica ultima stabile → https://github.com/open-webui/open-webui/releases
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      # ---------- Database ----------
      DATABASE_URL: postgresql://owui:${POSTGRES_PASSWORD}@postgres:5432/openwebui

      # ---------- Vector DB ----------
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://owui:${POSTGRES_PASSWORD}@postgres:5432/openwebui

      # ---------- Content extraction: built-in ----------
      CONTENT_EXTRACTION_ENGINE: ""

      # ---------- Embedding: e5-large LOCALE in-process ----------
      RAG_EMBEDDING_ENGINE: ""                                # vuoto = SentenceTransformers locale
      RAG_EMBEDDING_MODEL: "intfloat/multilingual-e5-base" # 1GB
      #RAG_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      RAG_EMBEDDING_BATCH_SIZE: "8"
      RAG_EMBEDDING_QUERY_PREFIX: "query: "
      RAG_EMBEDDING_CONTENT_PREFIX: "passage: "

      # ---------- Reranker INTERNO (CrossEncoder locale) ----------
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_RERANKING_ENGINE: ""                                # vuoto = CrossEncoder locale
      RAG_RERANKING_MODEL: "" #BAAI/bge-reranker-v2-m3 molto lento se non ho GPU
      RAG_TOP_K: "12"
      RAG_TOP_K_RERANKER: "5"
      RAG_RELEVANCE_THRESHOLD: "0.2"

      # ---------- Chunking tarato per documenti lunghi ----------
      CHUNK_SIZE: "1500"
      CHUNK_OVERLAP: "200"
      RAG_TEXT_SPLITTER: "token"

      # ---------- LLM: OpenRouter (cloud) + Bonsai (locale) ----------
      # Open WebUI mostra entrambi nella selezione modello
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "https://openrouter.ai/api/v1"
      OPENAI_API_KEYS: "${OPENROUTER_API_KEY:?serve OPENROUTER_API_KEY in .env};sk-non-serve"
      OPENAI_MODELS: "google/gemini-3.1-flash-lite,google/gemini-2.5-flash-lite"

      # ---------- Disabilita Ollama se non lo usi ----------
      ENABLE_OLLAMA_API: "false"

      # ---------- Sicurezza ----------
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?genera una chiave random lunga}
      WEBUI_AUTH: "true"

      # ---------- HuggingFace (necessario per scaricare i modelli) ----------
      HF_TOKEN: ${HF_TOKEN:-}

      # ---------- RAG-only: rispondi SOLO dai documenti ----------
      DEFAULT_RAG_TEMPLATE: |
        Usa ESCLUSIVAMENTE le fonti qui sotto per rispondere.
        Non usare conoscenza esterna. Non inventare informazioni.
        Se la risposta non è presente nelle fonti, rispondi:
        "Non ho trovato questa informazione nei documenti disponibili."

        ### FONTI ###
        [context]

        ### DOMANDA ###
        [query]

      # ---------- Suggerimenti home: domande aziendali ----------
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [
          {"title":["Riepilogami il documento","in 5 punti chiave"],"content":"Riepilogami questo documento in massimo 5 punti chiave."},
          {"title":["Quali sono le scadenze","o date importanti?"],"content":"Elenca tutte le scadenze, date e termini importanti presenti nel documento."},
          {"title":["Spiega i termini tecnici","presenti nel testo"],"content":"Identifica e spiega i termini tecnici o specialistici presenti nel documento."},
          {"title":["Cosa devo fare","in base a questo documento?"],"content":"Quali azioni o passi devo intraprendere in base al contenuto di questo documento?"}
        ]

      # ---------- Follow-up in italiano, vincolati al documento ----------
      FOLLOW_UP_GENERATION_PROMPT_TEMPLATE: >-
        Basandoti SOLO sul documento consultato, genera 3 domande di approfondimento
        in italiano che l'utente potrebbe voler fare. Le domande devono riguardare
        esclusivamente i contenuti presenti nelle fonti recuperate.
        Rispondi con le sole 3 domande, una per riga, senza numerazione né prefissi.

      WEBUI_DEFAULT_SYSTEM_PROMPT: >-
        Sei un assistente documentale. Rispondi SOLO in base ai documenti
        forniti nel contesto della conversazione. Se l'informazione richiesta
        non è presente nei documenti allegati o nella knowledge base, dì
        esplicitamente: "Non ho trovato questa informazione nei documenti
        disponibili." Non usare la tua conoscenza generale. Non inventare.
    volumes:
      - openwebui_data:/app/backend/data
      - hf_cache:/root/.cache/huggingface         # cache modelli HF condivisa fra restart
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  openwebui_data:
  hf_cache: